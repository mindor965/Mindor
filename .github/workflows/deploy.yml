name: Deploy to GitHub Pages (Disabled)

# This GitHub Pages deployment workflow is disabled because Mindor is deployed exclusively on Vercel.
# Next.js 15 with dynamic server-rendered routes (/blog/[id]) and Sanity Studio (/studio/[[...tool]])
# requires a Node.js runtime and is incompatible with static GitHub Pages.
# Automatic triggers (push, pull_request) have been removed to prevent deployment failures.
#
# Primary Production Deployment: Vercel
# GitHub repository: https://github.com/mindor965/Mindor

on:
  workflow_dispatch: # Retained for manual trigger only; will never trigger on push or pull_request

jobs:
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Informational Notice
        run: |
          echo "GitHub Pages deployment is disabled for Mindor."
          echo "Mindor is deployed directly to Vercel."
